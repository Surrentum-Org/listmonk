# Surrentum overlay for the ListMonk compose file (use with `-f docker-compose.yml -f docker-compose.surrentum.yml`).
# Puts ListMonk and the bounce bridge on a fixed network so Stalwart can pin the sending
# credential to their addresses, and makes mail.keffals.gg resolve to this host inside the
# containers (local submission, the TLS certificate still matches).
services:
  app:
    networks:
      default: {}
      mailstack:
        ipv4_address: 172.23.43.2
    extra_hosts:
      - "mail.keffals.gg:172.23.43.1"
  bridge:
    image: python:3.12-alpine@sha256:e064671ca452259bab50e8e2c7bd896e39e9a343bb06ca25234adf6fe18d0fc7
    container_name: mailstack-bridge
    restart: unless-stopped
    depends_on:
      - app
    command: ["python", "/opt/mailstack/bridge.py"]
    environment:
      MAILSTACK_STORE: /run/mailstack
      MAILSTACK_SMTP_STORE: /run/mailstack/newsletter.json
      MAILSTACK_API_STORE: /run/mailstack/listmonk-api.json
    volumes:
      - ./mailstack:/opt/mailstack:ro
      - /etc/mail-stack:/run/mailstack:ro
    extra_hosts:
      - "mail.keffals.gg:172.23.43.1"
    networks:
      default: {}
      mailstack:
        ipv4_address: 172.23.43.3
    mem_limit: 128m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket;socket.create_connection(('app',9000),3)\""]
      interval: 60s
      timeout: 5s
      retries: 3
networks:
  mailstack:
    ipam:
      config:
        - subnet: 172.23.43.0/28
