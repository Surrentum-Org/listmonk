name: surrentum-ci
# Org ruleset needs a check named ci-ok. Runs only our overlay's tests; upstream's own workflows are untouched.
on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci-ok:
    name: ci-ok
    runs-on: [self-hosted, ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest surrentum/tests/test_bounce.py
      - run: sh -n surrentum/mailstack/mailstack
